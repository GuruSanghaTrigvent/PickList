<div class="picklist-container">
  <!-- Left List with Controls on the LEFT -->
  <div class="list-row">
    <div class="side-controls">
      <button mat-icon-button (click)="moveToTop(availableItems, selectedAvailable)" [disabled]="!selectedAvailable.length">
        <mat-icon>vertical_align_top</mat-icon>
      </button>
      <button mat-icon-button (click)="moveUp(availableItems, selectedAvailable)" [disabled]="!selectedAvailable.length">
        <mat-icon>arrow_upward</mat-icon>
      </button>
      <button mat-icon-button (click)="moveDown(availableItems, selectedAvailable)" [disabled]="!selectedAvailable.length">
        <mat-icon>arrow_downward</mat-icon>
      </button>
      <button mat-icon-button (click)="moveToBottom(availableItems, selectedAvailable)" [disabled]="!selectedAvailable.length">
        <mat-icon>vertical_align_bottom</mat-icon>
      </button>
    </div>
    <mat-selection-list
      #availableList
      [(ngModel)]="selectedAvailable"
      class="list"
      (keydown)="onKeydown($event)"
      (keyup)="onKeyup($event)"
      (focus)="onListFocus('available')"
      [tabIndex]="0">
      <mat-list-option *ngFor="let item of availableItems" [value]="item">
        {{ item }}
      </mat-list-option>
    </mat-selection-list>
  </div>

  <!-- Center Controls -->
  <div class="controls-center">
    <button mat-icon-button (click)="moveSelectedToRight()" [disabled]="!selectedAvailable.length">
      <mat-icon>chevron_right</mat-icon>
    </button>
    <button mat-icon-button (click)="moveAllToRight()" [disabled]="!availableItems.length">
      <mat-icon>keyboard_double_arrow_right</mat-icon>
    </button>
    <button mat-icon-button (click)="moveAllToLeft()" [disabled]="!selectedItems.length">
      <mat-icon>keyboard_double_arrow_left</mat-icon>
    </button>
    <button mat-icon-button (click)="moveSelectedToLeft()" [disabled]="!selectedSelected.length">
      <mat-icon>chevron_left</mat-icon>
    </button>
  </div>

  <!-- Right List with Controls on the RIGHT -->
  <div class="list-row">
    <mat-selection-list
      #selectedList
      [(ngModel)]="selectedSelected"
      class="list"
      (keydown)="onKeydown($event)"
      (keyup)="onKeyup($event)"
      (focus)="onListFocus('selected')"
      [tabIndex]="0">
      <mat-list-option *ngFor="let item of selectedItems" [value]="item">
        {{ item }}
      </mat-list-option>
    </mat-selection-list>
    <div class="side-controls">
      <button mat-icon-button (click)="moveToTop(selectedItems, selectedSelected)" [disabled]="!selectedSelected.length">
        <mat-icon>vertical_align_top</mat-icon>
      </button>
      <button mat-icon-button (click)="moveUp(selectedItems, selectedSelected)" [disabled]="!selectedSelected.length">
        <mat-icon>arrow_upward</mat-icon>
      </button>
      <button mat-icon-button (click)="moveDown(selectedItems, selectedSelected)" [disabled]="!selectedSelected.length">
        <mat-icon>arrow_downward</mat-icon>
      </button>
      <button mat-icon-button (click)="moveToBottom(selectedItems, selectedSelected)" [disabled]="!selectedSelected.length">
        <mat-icon>vertical_align_bottom</mat-icon>
      </button>
    </div>
  </div>
</div>
