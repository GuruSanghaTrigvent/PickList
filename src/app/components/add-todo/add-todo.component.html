<div class="">
  <form (ngSubmit)="submitAddTodo()" #todoForm="ngForm">
    <div class="mb-3">
      <label for="titleInput" class="form-label">Title</label>
      <input
        type="text"
        name="title"
        [(ngModel)]="title"
        class="form-control"
        id="titleInput"
      />
    </div>
    <div class="mb-3">
      <label for="descInput" class="form-label">Description</label>
      <input
        type="text"
        name="desc"
        [(ngModel)]="desc"
        class="form-control"
        id="descInput"
      />
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>
